<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>青晏的工作台 · 大学生活 & 求职管理</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/avatar-pixel.png" alt="青晏">
        <div>
          <div class="brand-name" id="brand-name">工作台</div>
          <div class="brand-sub" id="brand-sub"></div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <button id="theme-btn" type="button">🌙 深色</button>
        <span id="updated"></span>
      </div>
    </aside>

    <main>
      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-career"></section>
      <section class="view" id="view-schedule"></section>
      <section class="view" id="view-tasks"></section>
      <section class="view" id="view-achievements"></section>
      <section class="view" id="view-beichen"></section>
      <section class="view" id="view-about"></section>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
